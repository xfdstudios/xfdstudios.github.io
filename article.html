    <script>
      const portalInfo = {
        horror:     { label: 'Horror',       href: 'horror.html' },
        anime:      { label: 'Anime & Manga', href: 'anime.html' },
        wrestling:  { label: 'Wrestling',     href: 'wrestling.html' },
        tech:       { label: 'Gaming & Tech', href: 'tech-gaming.html' },
        popculture: { label: 'Pop Culture',   href: 'popculture.html' }
      };

      const THREADS_PROFILE = 'https://www.threads.com/@xenofinaldawn';

      function getVideoId(url) {
        if (!url) return null;
        const parts = url.split('/');
        return parts[parts.length - 1].split('?')[0];
      }

      async function loadArticle() {
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');

        if (!articleId) {
          document.querySelector('#article-title').textContent = 'No article specified.';
          return;
        }

        // Every article has its own crawlable page under /articles/ (built by
        // scripts/build_article_pages.py), so send old article.html?id= links
        // there. If that page hasn't been built yet, render here as before.
        const staticPage = `articles/${encodeURIComponent(articleId)}.html`;
        try {
          const found = await fetch(staticPage, { method: 'HEAD' });
          if (found.ok) {
            location.replace(staticPage);
            return;
          }
        } catch (e) {
          // Offline or blocked: fall through and render in place.
        }

        const response = await fetch('articles.json');
        const articles = await response.json();
        const article = articles.find(a => a.id === articleId);

        if (!article) {
          document.querySelector('#article-title').textContent = 'Article not found.';
          return;
        }

        const portal = portalInfo[article.portal] || { label: article.portal, href: 'index.html' };

        document.title = `${article.title} — XFD`;

        const backLink = document.querySelector('#article-back-link');
        backLink.href = portal.href;
        document.querySelector('#article-back-label').textContent = `Back to ${portal.label}`;

        document.querySelector('#article-portal-label').textContent = portal.label;
        document.querySelector('#article-title').textContent = article.title;

        const date = new Date(`${article.date}T00:00:00`).toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric'
        });
        document.querySelector('#article-meta').textContent = `${article.type} // ${date}`;

        if (article.videoUrl) {
          const videoId = getVideoId(article.videoUrl);
          const frame = document.querySelector('#article-video-frame');
          frame.src = `https://www.youtube.com/embed/${videoId}?rel=0`;
          document.querySelector('#article-video-wrap').hidden = false;

          const watchLink = document.querySelector('#article-watch-link');
          watchLink.href = article.videoUrl;
          watchLink.hidden = false;
        } else {
          // Text/Threads posts (no video): link out to Threads instead.
          const threadLink = document.querySelector('#article-thread-link');
          threadLink.href = article.threadsUrl || THREADS_PROFILE;
          threadLink.hidden = false;
        }

        const bodyEl = document.querySelector('#article-body');
        const text = (article.body || article.summary || '').trim();
        const escapeHtml = (s) => s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        // Inline [label](url) links. Escaping always runs first, so the link
        // markup is the only HTML we ever emit from body text. A url is only
        // accepted if it's http(s) or scheme-less (a relative page link), which
        // keeps javascript: and data: URLs out; anything else stays plain text.
        const safeHref = (href) =>
          !/["'<>]/.test(href) && (/^https?:\/\//.test(href) || !href.includes(':'));
        const inline = (s) => escapeHtml(s).replace(
          /\[([^\]]+)\]\(([^)\s]+)\)/g,
          (whole, label, href) => {
            if (!safeHref(href)) return whole;
            const external = /^https?:\/\//.test(href);
            const attrs = external ? ' target="_blank" rel="noopener"' : '';
            return `<a href="${href}"${attrs}>${label}</a>`;
          }
        );
        // If the body uses blank-line paragraphs, split on those (single newlines
        // inside a paragraph become <br>). If it only uses single line breaks,
        // treat every line as its own paragraph so it doesn't render as one wall.
        const hasBlankLines = /\n\s*\n/.test(text);
        const HEADING = /^#{2,3}\s+/;
        const BULLET = /^[-*]\s+/;
        // A block with no "## heading" or "- bullet" lines renders exactly as it
        // always did: one <p>, with single newlines becoming <br>. Only blocks
        // that actually use the markup take the parsing path, so every existing
        // article is untouched.
        const renderBlock = (block) => {
          const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);
          if (!lines.some((l) => HEADING.test(l) || BULLET.test(l))) {
            return `<p>${inline(block).replace(/\n/g, '<br>')}</p>`;
          }
          let html = '';
          let list = [];
          let para = [];
          const flushList = () => {
            if (!list.length) return;
            html += `<ul>${list.map((li) => `<li>${inline(li)}</li>`).join('')}</ul>`;
            list = [];
          };
          const flushPara = () => {
            if (!para.length) return;
            html += `<p>${para.map(inline).join('<br>')}</p>`;
            para = [];
          };
          lines.forEach((line) => {
            if (HEADING.test(line)) {
              flushList();
              flushPara();
              html += `<h2>${escapeHtml(line.replace(HEADING, ''))}</h2>`;
            } else if (BULLET.test(line)) {
              flushPara();
              list.push(line.replace(BULLET, ''));
            } else {
              flushList();
              para.push(line);
            }
          });
          flushList();
          flushPara();
          return html;
        };
        bodyEl.innerHTML = text
          .split(hasBlankLines ? /\n\s*\n/ : /\n+/)
          .map((para) => para.trim())
          .filter(Boolean)
          .map(renderBlock)
          .join('')
          // Bullets split across adjacent blocks should read as one list.
          .replace(/<\/ul><ul>/g, '');
      }

      loadArticle();
    </script>
